<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruby</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="55%" stop-color="#a80f2b"/>
      <stop offset="100%" stop-color="#5c0a1c"/>
    </linearGradient>
  </defs>
</svg>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="gem-mark spin-slow" aria-hidden="true">
        <polygon points="5,4 19,4 23,10 12,22 1,10" fill="url(#gemGrad)" stroke="#d4af37" stroke-width="0.6"/>
        <polygon points="5,4 19,4 15.5,10 8.5,10" fill="#ff6b83" fill-opacity="0.5"/>
        <polyline points="5,4 1,10 12,22" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
        <polyline points="19,4 23,10 12,22" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
        <line x1="1" y1="10" x2="23" y2="10" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
      </svg>
      <span class="brand-name">Ruby</span>
    </div>
    <div class="topbar-controls">
      <div class="provider-toggle" id="providerToggle"></div>
      <button type="button" class="icon-toggle-btn" id="voiceOutToggle" title="Read replies aloud"></button>
      <button type="button" class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New chat</span>
      </button>
    </div>
  </header>

  <main class="chat-area" id="chatArea">
    <div class="chat-inner">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" class="gem-mark spin-slow" aria-hidden="true">
          <polygon points="5,4 19,4 23,10 12,22 1,10" fill="url(#gemGrad)" stroke="#d4af37" stroke-width="0.6"/>
          <polygon points="5,4 19,4 15.5,10 8.5,10" fill="#ff6b83" fill-opacity="0.5"/>
          <polyline points="5,4 1,10 12,22" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
          <polyline points="19,4 23,10 12,22" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
          <line x1="1" y1="10" x2="23" y2="10" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>
        </svg>
        <h1>What can I help with?</h1>
        <p>I'm Ruby. Ask me anything, hand me an image, or just talk — I'll answer with whichever engine you've connected below.</p>
        <div class="suggestion-row">
          <button type="button" class="suggestion-chip" data-prompt="Explain quantum computing like I'm smart but new to it">Explain quantum computing simply</button>
          <button type="button" class="suggestion-chip" data-prompt="Write a Python script that renames every file in a folder to remove spaces">Write a file-renaming script</button>
          <button type="button" class="suggestion-chip" data-prompt="Plan a relaxed 3-day trip to Kyoto, Japan">Plan a 3-day trip to Kyoto</button>
          <button type="button" class="suggestion-chip" data-prompt="Help me debug this error: ">Help me debug an error</button>
        </div>
        <div class="setup-banner hidden" id="disabledHint">
          Ruby needs an API key before it can chat. <a href="/settings">Add one in Settings →</a>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="image-preview-strip hidden" id="imagePreviewStrip"></div>
    <form class="composer" id="composerForm">
      <button type="button" class="icon-btn" id="attachBtn" title="Attach an image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 6.5 8.8 14.2a3 3 0 1 0 4.2 4.2l8-8a5 5 0 0 0-7.1-7.1L5 12.2a7 7 0 0 0 9.9 9.9"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <textarea id="messageInput" placeholder="Message Ruby..." rows="1"></textarea>
      <button type="button" class="icon-btn" id="micBtn" title="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
      </button>
      <button type="submit" class="icon-btn send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><path d="M6 11l6-6 6 6"/></svg>
      </button>
    </form>
  </div>

  <footer class="site-footer">
    <span>Ruby · runs on your own API keys</span>
    <a href="/settings" class="footer-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5 20 3"/><path d="M16 7l3 3"/><path d="M13 10l2.5 2.5"/></svg>
      API Keys
    </a>
  </footer>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
